function baseKey(k){return typeof k==='string'?k.replace(/~\d+$/,'').replace(/[+*]+$/,''):k}const SPECIMEN_RELIC_MAP={'発光クラゲ晶':'深海時計','オウムガイ殻':'オウムガイの護殻','古代鮫の歯':'深淵の瞳','紅珊瑚片':'珊瑚の護符','毒針標本':'毒腺の指輪','黒潮瓶':'古代の盾','星砂の小瓶':'スラッシュブースト','皇帝の骨片':'皇帝の骨片'};function migrateSpecimens(g){if(!Array.isArray(g.specimens))return;g.relic=Array.isArray(g.relic)?g.relic:[];let icons={'深海時計':'⏱️','オウムガイの護殻':'🐚','深淵の瞳':'🌌','珊瑚の護符':'🪸','毒腺の指輪':'💍','古代の盾':'🛡️','スラッシュブースト':'🗡️','皇帝の骨片':'🦴'};for(let old of g.specimens){let name=SPECIMEN_RELIC_MAP[old];if(name&&!g.relic.some(r=>r[1]===name))g.relic.push([icons[name]||'🔱',name])}delete g.specimens}const OLD_RELIC_NAME_MAP={'真珠炉':'黄金炉','深海真珠':'スラッシュブースト','真珠王座':'黄金王座','逆鱗':'竜の逆鱗','捕食王の冠':'次元圧縮','反転鱗':'水圧変異','潮流の牙':'深淵の瞳','深海金貨':'スラッシュブースト','古代の甲殻':'古代の盾'};function migrateRelicNames(g){if(!Array.isArray(g.relic))return;let seen=new Set();g.relic=g.relic.map(r=>[r[0],OLD_RELIC_NAME_MAP[r[1]]||r[1]]).filter(r=>!seen.has(r[1])&&seen.add(r[1]))}
