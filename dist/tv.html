<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABYSS DECK — TV/コントローラー版</title><link rel="icon" href="assets/icons/icon-192.png">
<style>
:root{--ink:#e7f3f3;--muted:#8ea9ad;--gold:#e3bd69;--aqua:#49d9d0;--bg:#03070d}
html,body{margin:0;width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:'Noto Sans JP',sans-serif;color:var(--ink)}
#stage-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#0b1a24,#03070d 72%)}
#stage{width:430px;height:932px;border:0;transform-origin:center center;box-shadow:0 0 90px #000d,0 0 0 2px #1a2a33;border-radius:16px;background:#03070d}
#gp-focus-ring{position:fixed;pointer-events:none;z-index:99999;border:3px solid var(--gold);border-radius:12px;box-shadow:0 0 0 3px #00000090,0 0 20px var(--gold);transition:left .12s ease,top .12s ease,width .12s ease,height .12s ease;display:none}
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font-size:15px;color:var(--muted);letter-spacing:.04em;opacity:.9;pointer-events:none;transition:opacity .5s;background:#03070dcc;padding:8px 18px;border-radius:999px;border:1px solid #1c2e36;white-space:nowrap}
#hint.hide{opacity:0}
#fullscreen-btn{position:fixed;top:16px;right:18px;z-index:100000;background:#0a1620cc;border:1px solid #2c4650;color:var(--ink);border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit}
#fullscreen-btn:hover{background:#123042}
</style></head>
<body>
<script>try{localStorage.setItem('abyssA2hsSeen','1')}catch(e){}</script>
<div id="stage-wrap">
<iframe id="stage" src="index.html" title="ABYSS DECK" allow="autoplay; fullscreen; gamepad"></iframe>
<div id="gp-focus-ring"></div>
</div>
<div id="hint">🎮 コントローラーを接続してください（矢印キー＋Enter／Escapeでも操作できます）</div>
<button id="fullscreen-btn" type="button">⛶ フルスクリーン</button>
<script src="tv-input.js?v=3"></script>
</body></html>
