<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>ABYSS DECK — TV/コントローラー版</title><link rel="icon" href="assets/icons/icon-192.png">
<style>
:root{--ink:#e7f3f3;--muted:#8ea9ad;--gold:#e3bd69;--aqua:#49d9d0;--bg:#03070d}
html,body{margin:0;width:100%;height:100%;height:100dvh;background:var(--bg);overflow:hidden;font-family:'Noto Sans JP',sans-serif;color:var(--ink);touch-action:manipulation}
#stage-wrap{position:fixed;inset:0;background:var(--bg)}
#stage{width:100%;height:100%;border:0;background:#03070d;opacity:0;transition:opacity .25s ease}
#stage.ready{opacity:1}
#gp-focus-ring{position:fixed;pointer-events:none;z-index:99999;border:3px solid var(--gold);border-radius:12px;box-shadow:0 0 0 3px #00000090,0 0 20px var(--gold);transition:left .12s ease,top .12s ease,width .12s ease,height .12s ease;display:none}
#tv-toolbar{position:fixed;top:0;right:14px;height:44px;z-index:100001;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px}
#tv-toolbar button{background:#09141dcc;border:1px solid #36525e;color:var(--ink);border-radius:8px;padding:4px 8px;font-size:11px;line-height:1.2;font-weight:900;cursor:pointer;font-family:inherit;white-space:nowrap}
#tv-toolbar button:hover{background:#123042}
/* Explicit height + flex centering, matching the HUD chips/nav buttons exactly,
   so this button's rendered size can't drift from theirs due to font-fallback
   differences between browsers (the two live in separate documents/stacking
   contexts — this one in tv.html, the others inside the game iframe). */
#tv-settings-btn{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;height:24px;padding:0 8px;line-height:1}
#controller-toggle.off{color:var(--muted);border-color:#243239}
#tv-settings-panel{display:flex;flex-direction:column;gap:6px;background:#0a1620f0;border:1px solid #2c4650;border-radius:10px;padding:8px;margin-top:2px}
#tv-settings-panel[hidden]{display:none}
#tv-settings-panel button{width:100%;text-align:left}
#tv-settings-backdrop{position:fixed;inset:0;z-index:100000;display:none}
#tv-settings-backdrop.on{display:block}
</style></head>
<body>
<script>try{localStorage.setItem('abyssA2hsSeen','1')}catch(e){}</script>
<div id="stage-wrap">
<iframe id="stage" src="index.html" title="ABYSS DECK" allow="autoplay; fullscreen; gamepad"></iframe>
<div id="gp-focus-ring"></div>
</div>
<div id="tv-settings-backdrop"></div>
<div id="tv-toolbar">
<button id="tv-settings-btn" type="button">⚙ 設定</button>
<div id="tv-settings-panel" hidden>
<button id="sound-toggle" type="button">♫ 音楽：ON</button>
<button id="controller-toggle" type="button">🎮 コントローラー操作：ON</button>
<button id="fullscreen-btn" type="button">⛶ フルスクリーン</button>
</div>
</div>
<script src="tv-input.js?v=12"></script>
</body></html>
